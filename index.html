<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Python-Faithful Rig Editor</title>
    <style>
        body { margin: 0; background: #181818; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        #ui { position: absolute; right: 10px; top: 10px; width: 220px; background: rgba(30, 30, 30, 0.9); padding: 15px; border-radius: 8px; border: 1px solid #444; z-index: 10; }
        h3 { margin: 0 0 10px 0; color: #00ffff; font-size: 14px; }
        label { display: block; font-size: 11px; color: #aaa; margin-top: 8px; }
        input[type=range] { width: 100%; }
        button { width: 100%; padding: 8px; margin-top: 6px; cursor: pointer; background: #3e3e42; color: white; border: none; border-radius: 4px; }
        #timeline { position: absolute; bottom: 0; width: 100%; height: 80px; background: #111; display: flex; align-items: center; padding: 0 20px; overflow-x: auto; z-index: 10; border-top: 1px solid #333; }
        .frame { min-width: 45px; height: 45px; background: #444; margin-right: 10px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; flex-shrink: 0; }
        .frame.active { background: #007acc; border: 2px solid white; }
    </style>
</head>
<body>

<div id="ui">
    <h3 id="bone-label">Selected: Root</h3>
    <label>Rotation X</label><input type="range" id="rotX" min="-3.14" max="3.14" step="0.01">
    <label>Rotation Y</label><input type="range" id="rotY" min="-3.14" max="3.14" step="0.01">
    <label>Rotation Z</label><input type="range" id="rotZ" min="-3.14" max="3.14" step="0.01">
    <hr style="border:0; border-top:1px solid #444; margin:10px 0;">
    <button onclick="addFrame()" style="background:#4CAF50">+ NEW FRAME</button>
    <button onclick="copyFrame()">COPY CURRENT</button>
    <button onclick="deleteFrame()" style="background:#d9534f">DELETE FRAME</button>
    <button id="playBtn" onclick="togglePlay()" style="background:#007acc">PLAY</button>
</div>

<div id="timeline"></div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "controls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'controls';

    // --- CONFIGURATION ---
    const skeletonConfig = {
        "Root":      { parent: null,    len: 0,   dir: [0,0,0] },
        "Pelvis_L":  { parent: "Root",  len: 0.6, dir: [-1,0,0] },
        "Pelvis_R":  { parent: "Root",  len: 0.6, dir: [1,0,0] },
        "Spine":     { parent: "Root",  len: 1.5, dir: [0,1,0] },
        "Chest":     { parent: "Spine", len: 1.2, dir: [0,1,0] },
        "Neck":      { parent: "Chest", len: 0.5, dir: [0,1,0] },
        "Head":      { parent: "Neck",  len: 0.7, dir: [0,1,0] },
        "L_Arm":     { parent: "Chest", len: 1.2, dir: [-1,0,0] },
        "L_Forearm": { parent: "L_Arm", len: 1.0, dir: [-1,0,0] },
        "R_Arm":     { parent: "Chest", len: 1.2, dir: [1,0,0] },
        "R_Forearm": { parent: "R_Arm", len: 1.0, dir: [1,0,0] },
        "L_Thigh":   { parent: "Pelvis_L", len: 1.8, dir: [0,-1,0] },
        "L_Calf":    { parent: "L_Thigh",  len: 1.6, dir: [0,-1,0] },
        "R_Thigh":   { parent: "Pelvis_R", len: 1.8, dir: [0,-1,0] },
        "R_Calf":    { parent: "R_Thigh",  len: 1.6, dir: [0,-1,0] }
    };

    // --- STATE ---
    let frames = [];
    let currentIdx = 0;
    let selectedBone = "Root";
    let isPlaying = false;
    const bones = {}; // Stores THREE.Group (the pivots)
    const boneLines = {}; // Stores the line meshes

    // --- SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181818);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    camera.position.set(0, 2, 10);

    // Build Bones
    Object.keys(skeletonConfig).forEach(name => {
        const group = new THREE.Group();
        group.name = name;
        
        // Pivot Sphere
        const pivot = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({color: 0x00ffff}));
        group.add(pivot);

        // Orange Forward Arrow (Normal)
        const arrow = new THREE.ArrowHelper(new THREE.Vector3(0,0,1), new THREE.Vector3(0,0,0), 0.6, 0xffa500);
        arrow.name = name + "_arrow";
        group.add(arrow);

        bones[name] = group;

        if (skeletonConfig[name].parent) {
            bones[skeletonConfig[name].parent].add(group);
            const d = skeletonConfig[name].dir;
            const l = skeletonConfig[name].len;
            group.position.set(d[0]*l, d[1]*l, d[2]*l);

            // Draw the line connecting to parent
            const points = [new THREE.Vector3(0,0,0), new THREE.Vector3(-d[0]*l, -d[1]*l, -d[2]*l)];
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(lineGeo, new THREE.MeshBasicMaterial({color: 0xffffff}));
            group.add(line);
            boneLines[name] = line;
        } else {
            scene.add(group);
        }
    });

    // --- FUNCTIONS ---
    function addFrame() {
        const f = {};
        Object.keys(skeletonConfig).forEach(n => f[n] = [0,0,0]);
        frames.push(f);
        currentIdx = frames.length - 1;
        updateUI();
    }

    function copyFrame() {
        frames.push(JSON.parse(JSON.stringify(frames[currentIdx])));
        currentIdx = frames.length - 1;
        updateUI();
    }

    function deleteFrame() {
        if (frames.length > 1) {
            frames.splice(currentIdx, 1);
            currentIdx = Math.max(0, currentIdx - 1);
            updateUI();
        }
    }

    function updateUI() {
        const pose = frames[currentIdx];
        document.getElementById('bone-label').innerText = "Selected: " + selectedBone;
        document.getElementById('rotX').value = pose[selectedBone][0];
        document.getElementById('rotY').value = pose[selectedBone][1];
        document.getElementById('rotZ').value = pose[selectedBone][2];

        // Apply poses to 3D
        Object.keys(bones).forEach(name => {
            const rot = pose[name];
            bones[name].rotation.set(rot[0], rot[1], rot[2]);
            // Highlight selected
            bones[name].children[0].material.color.set(name === selectedBone ? 0xffff00 : 0x00ffff);
            bones[name].getObjectByName(name + "_arrow").visible = (name === selectedBone);
        });

        renderTimeline();
    }

    function renderTimeline() {
        const tl = document.getElementById('timeline');
        tl.innerHTML = '';
        frames.forEach((f, i) => {
            const div = document.createElement('div');
            div.className = `frame ${i === currentIdx ? 'active' : ''}`;
            div.innerText = i;
            div.onclick = () => { currentIdx = i; updateUI(); };
            tl.appendChild(div);
        });
    }

    window.addFrame = addFrame;
    window.copyFrame = copyFrame;
    window.deleteFrame = deleteFrame;
    window.togglePlay = () => {
        isPlaying = !isPlaying;
        document.getElementById('playBtn').innerText = isPlaying ? "STOP" : "PLAY";
        if(isPlaying) playLoop();
    };

    function playLoop() {
        if(!isPlaying) return;
        currentIdx = (currentIdx + 1) % frames.length;
        updateUI();
        setTimeout(playLoop, 200);
    }

    // Input Listeners
    ['rotX', 'rotY', 'rotZ'].forEach((id, axis) => {
        document.getElementById(id).oninput = (e) => {
            frames[currentIdx][selectedBone][axis] = parseFloat(e.target.value);
            updateUI();
        };
    });

    // Touch/Mouse Selection
    renderer.domElement.addEventListener('pointerdown', (e) => {
        const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);
        if (intersects.length > 0) {
            let obj = intersects[0].object;
            while (obj.parent && !skeletonConfig[obj.name]) { obj = obj.parent; }
            if (skeletonConfig[obj.name]) {
                selectedBone = obj.name;
                updateUI();
            }
        }
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    addFrame(); // Start with one frame
    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    animate();
</script>
</body>
</html>
