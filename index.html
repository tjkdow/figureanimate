<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Rig: Final Fixed Hierarchy</title>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        #ui { position: absolute; right: 10px; top: 10px; width: 220px; background: rgba(20, 20, 20, 0.9); padding: 15px; border-radius: 8px; border: 1px solid #444; z-index: 100; }
        #bone-label { font-size: 16px; font-weight: bold; color: #00ffff; display: block; margin-bottom: 10px; }
        label { display: block; font-size: 10px; color: #888; margin-top: 8px; text-transform: uppercase; }
        input[type=range] { width: 100%; }
        button { width: 100%; padding: 8px; margin-top: 5px; cursor: pointer; background: #333; color: white; border: 1px solid #555; border-radius: 4px; font-size: 11px; }
        #timeline { position: absolute; bottom: 0; width: 100%; height: 90px; background: #0a0a0a; display: flex; align-items: center; padding: 0 20px; overflow-x: auto; z-index: 100; border-top: 1px solid #333; }
        .frame { min-width: 50px; height: 50px; background: #222; margin-right: 10px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: grab; flex-shrink: 0; border: 1px solid #444; }
        .frame.active { border-color: #00ffff; background: #003333; }
    </style>
</head>
<body>

<div id="ui">
    <span id="bone-label">Root</span>
    <label>Rotation X</label><input type="range" id="rotX" min="-3.14" max="3.14" step="0.01">
    <label>Rotation Y</label><input type="range" id="rotY" min="-3.14" max="3.14" step="0.01">
    <label>Rotation Z</label><input type="range" id="rotZ" min="-3.14" max="3.14" step="0.01">
    <button onclick="mirrorSelected()" style="background:#6a1b9a; margin-top:15px;">MIRROR L/R</button>
    <button onclick="addFrame()" style="background:#2e7d32">+ NEW FRAME</button>
    <button onclick="copyFrame()">CLONE FRAME</button>
    <button id="playBtn" onclick="togglePlay()" style="background:#1565c0">PLAY</button>
</div>

<div id="timeline"></div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "controls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'controls';

    const config = {
        "Root":      { p: null,    l: 0,   d: [0,0,0] },
        "Pelvis_L":  { p: "Root",  l: 0.4, d: [-1,0,0] },
        "Pelvis_R":  { p: "Root",  l: 0.4, d: [1,0,0] },
        "Spine":     { p: "Root",  l: 1.0, d: [0,1,0] },
        "Chest":     { p: "Spine", l: 0.8, d: [0,1,0] },
        "Neck":      { p: "Chest", l: 0.3, d: [0,1,0] },
        "Head":      { p: "Neck",  l: 0.5, d: [0,1,0] },
        "L_Arm":     { p: "Chest", l: 0.8, d: [-1,0,0] },
        "L_Forearm": { p: "L_Arm", l: 0.7, d: [-1,0,0] },
        "L_Hand":    { p: "L_Forearm", l: 0.3, d: [-1,0,0] },
        "R_Arm":     { p: "Chest", l: 0.8, d: [1,0,0] },
        "R_Forearm": { p: "R_Arm", l: 0.7, d: [1,0,0] },
        "R_Hand":    { p: "R_Forearm", l: 0.3, d: [1,0,0] },
        "L_Thigh":   { p: "Pelvis_L", l: 1.2, d: [0,-1,0] },
        "L_Calf":    { p: "L_Thigh",  l: 1.0, d: [0,-1,0] },
        "L_Foot":    { p: "L_Calf",   l: 0.4, d: [0,0,1] },
        "R_Thigh":   { p: "Pelvis_R", l: 1.2, d: [0,-1,0] },
        "R_Calf":    { p: "R_Thigh",  l: 1.0, d: [0,-1,0] },
        "R_Foot":    { p: "R_Calf",   l: 0.4, d: [0,0,1] }
    };

    let frames = [];
    let currentIdx = 0;
    let selectedBone = "Root";
    let isPlaying = false;
    const pivots = {}; 
    const clickables = [];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 1, 7);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    new OrbitControls(camera, renderer.domElement);
    scene.add(new THREE.GridHelper(10, 10, 0x333333, 0x222222));

    // BUILDING LOGIC
    Object.keys(config).forEach(name => {
        const pivot = new THREE.Group();
        pivot.name = name;
        pivots[name] = pivot;

        // The Joint Dot
        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.06), new THREE.MeshBasicMaterial({color: 0x00ffff}));
        pivot.add(dot);

        // Selection Arrow (Middle)
        const arrow = new THREE.ArrowHelper(new THREE.Vector3(0,0,1), new THREE.Vector3(0,0,0), 0.5, 0xffa500);
        arrow.name = "arrow";
        pivot.add(arrow);

        if (config[name].p) {
            const parentPivot = pivots[config[name].p];
            parentPivot.add(pivot);
            
            // Move pivot to the tip of the parent's orientation
            const parentData = config[name]; // This is actually the child's data defining its offset from parent
            pivot.position.set(parentData.d[0]*parentData.l, parentData.d[1]*parentData.l, parentData.d[2]*parentData.l);

            // Create the visible bone connecting (0,0,0) to its own tip
            const boneLen = 0.01; // placeholder for children's length
            // We find the child's own dimensions for its bone mesh
            const l = config[name].l;
            const d = config[name].d;
            
            const geo = new THREE.CylinderGeometry(0.02, 0.02, l, 8);
            const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: 0xffffff}));
            
            // Offset the mesh so it starts at pivot and goes toward the direction
            // Since we don't know the next child yet, we use THIS bone's d/l to draw back to parent
            mesh.position.set(-d[0]*l/2, -d[1]*l/2, -d[2]*l/2);
            if(d[0] !== 0) mesh.rotation.z = Math.PI/2;
            else if(d[2] !== 0) mesh.rotation.x = Math.PI/2;
            
            pivot.add(mesh);
            mesh.userData.boneName = name;
            clickables.push(mesh);
            arrow.position.set(-d[0]*l/2, -d[1]*l/2, -d[2]*l/2);
        } else {
            scene.add(pivot); // Root
            dot.userData.boneName = name;
            clickables.push(dot);
        }
    });

    function addFrame() {
        const f = {};
        Object.keys(config).forEach(n => f[n] = [0,0,0]);
        frames.push(f);
        currentIdx = frames.length - 1;
        updateUI();
    }

    window.mirrorSelected = () => {
        let other = selectedBone.includes("L_") ? selectedBone.replace("L_", "R_") : selectedBone.replace("R_", "L_");
        if(pivots[other]) {
            const cur = frames[currentIdx][selectedBone];
            frames[currentIdx][other] = [cur[0], -cur[1], -cur[2]];
            updateUI();
        }
    };

    function updateUI() {
        const pose = frames[currentIdx];
        document.getElementById('bone-label').innerText = selectedBone;
        ['rotX', 'rotY', 'rotZ'].forEach((id, i) => document.getElementById(id).value = pose[selectedBone][i]);

        Object.keys(pivots).forEach(name => {
            const r = pose[name];
            pivots[name].rotation.set(r[0], r[1], r[2]);
            pivots[name].traverse(c => {
                if(c.isMesh && c.geometry.type === "CylinderGeometry") c.material.color.set(name === selectedBone ? 0xffff00 : 0xffffff);
                if(c.name === "arrow") c.visible = (name === selectedBone);
            });
        });
        renderTimeline();
    }

    function renderTimeline() {
        const tl = document.getElementById('timeline');
        tl.innerHTML = '';
        frames.forEach((f, i) => {
            const div = document.createElement('div');
            div.className = `frame ${i === currentIdx ? 'active' : ''}`;
            div.draggable = true;
            div.innerText = i + 1;
            div.onclick = () => { currentIdx = i; updateUI(); };
            div.onsort = () => {}; // Drag logic simplified for stability
            tl.appendChild(div);
        });
    }

    window.addFrame = addFrame;
    window.copyFrame = () => {
        frames.push(JSON.parse(JSON.stringify(frames[currentIdx])));
        currentIdx = frames.length - 1;
        updateUI();
    };
    window.togglePlay = () => {
        isPlaying = !isPlaying;
        document.getElementById('playBtn').innerText = isPlaying ? "STOP" : "PLAY";
        if(isPlaying) playLoop();
    };
    function playLoop() {
        if(!isPlaying) return;
        currentIdx = (currentIdx + 1) % frames.length;
        updateUI();
        setTimeout(playLoop, 150);
    }

    ['rotX', 'rotY', 'rotZ'].forEach((id, axis) => {
        document.getElementById(id).oninput = (e) => {
            frames[currentIdx][selectedBone][axis] = parseFloat(e.target.value);
            updateUI();
        };
    });

    renderer.domElement.addEventListener('pointerdown', (e) => {
        const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const hit = raycaster.intersectObjects(clickables)[0];
        if (hit) {
            selectedBone = hit.object.userData.boneName;
            updateUI();
        }
    });

    addFrame();
    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    animate();
</script>
</body>
</html>
