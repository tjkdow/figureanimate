<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Rig: Pro Animator</title>
    <style>
        body { margin: 0; background: #111; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        #ui { position: absolute; right: 10px; top: 10px; width: 220px; background: rgba(20, 20, 20, 0.95); padding: 15px; border-radius: 8px; border: 1px solid #444; z-index: 100; }
        #bone-label { font-size: 16px; font-weight: bold; color: #00ffff; display: block; margin-bottom: 10px; }
        label { display: block; font-size: 10px; color: #888; margin-top: 8px; text-transform: uppercase; }
        input[type=range] { width: 100%; cursor: pointer; }
        button { width: 100%; padding: 10px; margin-top: 8px; cursor: pointer; background: #333; color: white; border: 1px solid #555; border-radius: 4px; font-size: 11px; font-weight: bold; transition: 0.2s; }
        button:hover { background: #444; border-color: #00ffff; }
        
        #timeline { position: absolute; bottom: 0; width: 100%; height: 110px; background: #0a0a0a; display: flex; align-items: center; padding: 0 20px; overflow-x: auto; z-index: 100; border-top: 2px solid #333; gap: 10px; }
        .frame { 
            min-width: 65px; height: 65px; background: #222; display: flex; align-items: center; justify-content: center; 
            border-radius: 6px; cursor: grab; flex-shrink: 0; border: 2px solid #444; font-weight: bold; 
            color: #666; user-select: none; position: relative;
        }
        .frame.active { border-color: #00ffff; background: #003333; color: #00ffff; }
        .frame.dragging { opacity: 0.4; border: 2px dashed #00ffff; }
    </style>
</head>
<body>

<div id="ui">
    <label>Joint</label>
    <span id="bone-label">Root</span>
    <label>Rot X</label><input type="range" id="rotX" min="-3.14" max="3.14" step="0.01">
    <label>Rot Y</label><input type="range" id="rotY" min="-3.14" max="3.14" step="0.01">
    <label>Rot Z</label><input type="range" id="rotZ" min="-3.14" max="3.14" step="0.01">
    
    <div style="display:flex; gap:5px; margin-top:15px;">
        <button onclick="mirrorSide('L')" style="background:#6a1b9a; font-size:9px;">COPY L -> R</button>
        <button onclick="mirrorSide('R')" style="background:#6a1b9a; font-size:9px;">COPY R -> L</button>
    </div>
    <button onclick="createNewFrame()" style="background:#2e7d32">+ NEW FRAME</button>
    <button id="playBtn" onclick="togglePlayback()" style="background:#1565c0">PLAY ANIM</button>
</div>

<div id="timeline" id="timeline-container"></div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "controls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'controls';

    const config = {
        "Root":      { p: null,    l: 0,   d: [0,0,0] },
        "Pelvis_L":  { p: "Root",  l: 0.3, d: [-1,0,0] },
        "Pelvis_R":  { p: "Root",  l: 0.3, d: [1,0,0] },
        "Spine":     { p: "Root",  l: 0.8, d: [0,1,0] },
        "Chest":     { p: "Spine", l: 0.7, d: [0,1,0] },
        "Neck":      { p: "Chest", l: 0.2, d: [0,1,0] },
        "Head":      { p: "Neck",  l: 0.4, d: [0,1,0] },
        "L_Arm":     { p: "Chest", l: 0.7, d: [-1,0,0] },
        "L_Forearm": { p: "L_Arm", l: 0.6, d: [-1,0,0] },
        "L_Hand":    { p: "L_Forearm", l: 0.3, d: [-1,0,0] },
        "R_Arm":     { p: "Chest", l: 0.7, d: [1,0,0] },
        "R_Forearm": { p: "R_Arm", l: 0.6, d: [1,0,0] },
        "R_Hand":    { p: "R_Forearm", l: 0.3, d: [1,0,0] },
        "L_Thigh":   { p: "Pelvis_L", l: 1.0, d: [0,-1,0] },
        "L_Calf":    { p: "L_Thigh",  l: 0.9, d: [0,-1,0] },
        "L_Foot":    { p: "L_Calf",   l: 0.3, d: [0,0,1] },
        "R_Thigh":   { p: "Pelvis_R", l: 1.0, d: [0,-1,0] },
        "R_Calf":    { p: "R_Thigh",  l: 0.9, d: [0,-1,0] },
        "R_Foot":    { p: "R_Calf",   l: 0.3, d: [0,0,1] }
    };

    let frames = [];
    let currentIdx = 0;
    let selectedBone = "Root";
    let isPlaying = false;
    let draggedIdx = null;
    const pivots = {}; 
    const clickables = [];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 1, 6);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    new OrbitControls(camera, renderer.domElement);
    scene.add(new THREE.GridHelper(10, 10, 0x333333, 0x222222));

    function buildSkeleton() {
        Object.keys(config).forEach(name => {
            const pivot = new THREE.Group();
            pivot.name = name;
            pivots[name] = pivot;
            const dot = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({color: 0x00ffff}));
            pivot.add(dot);

            if (config[name].p) {
                const parentPivot = pivots[config[name].p];
                const pData = config[parentPivot.name];
                pivot.position.set(pData.d[0]*pData.l, pData.d[1]*pData.l, pData.d[2]*pData.l);
                parentPivot.add(pivot);

                const l = config[name].l;
                const d = config[name].d;
                if (l > 0) {
                    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, l, 8), new THREE.MeshBasicMaterial({color: 0xffffff}));
                    mesh.position.set(d[0]*l/2, d[1]*l/2, d[2]*l/2);
                    if(d[0] !== 0) mesh.rotation.z = Math.PI/2;
                    else if(d[2] !== 0) mesh.rotation.x = Math.PI/2;
                    pivot.add(mesh);
                    mesh.userData.boneName = name;
                    clickables.push(mesh);
                    const arrow = new THREE.ArrowHelper(new THREE.Vector3(0,0,1), new THREE.Vector3(d[0]*l/2, d[1]*l/2, d[2]*l/2), 0.4, 0xffa500);
                    arrow.name = "arrow";
                    arrow.visible = false;
                    pivot.add(arrow);
                }
            } else { scene.add(pivot); dot.userData.boneName = name; clickables.push(dot); }
        });
    }

    window.createNewFrame = () => {
        const newPose = JSON.parse(JSON.stringify(frames[currentIdx]));
        frames.push(newPose);
        currentIdx = frames.length - 1;
        updateApp();
    };

    window.mirrorSide = (sourceSide) => {
        const pose = frames[currentIdx];
        const targetSide = (sourceSide === 'L') ? 'R' : 'L';
        Object.keys(pose).forEach(name => {
            if(name.startsWith(sourceSide + "_") || name.endsWith("_" + sourceSide)) {
                let targetName = name.replace(sourceSide + "_", targetSide + "_").replace("_" + sourceSide, "_" + targetSide);
                if(pose[targetName]) {
                    const r = pose[name];
                    // Mirror math: Flip Y and Z rotation
                    pose[targetName] = [r[0], -r[1], -r[2]];
                }
            }
        });
        updateApp();
    };

    function updateApp() {
        const pose = frames[currentIdx];
        document.getElementById('bone-label').innerText = selectedBone;
        ['rotX', 'rotY', 'rotZ'].forEach((id, axis) => document.getElementById(id).value = pose[selectedBone][axis]);

        Object.keys(pivots).forEach(name => {
            const rot = pose[name];
            pivots[name].rotation.set(rot[0], rot[1], rot[2]);
            pivots[name].traverse(c => {
                if(c.isMesh && c.geometry.type === "CylinderGeometry") c.material.color.set(name === selectedBone ? 0xffff00 : 0xffffff);
                if(c.name === "arrow") c.visible = (name === selectedBone);
            });
        });

        renderTimeline();
    }

    function renderTimeline() {
        const tl = document.getElementById('timeline');
        tl.innerHTML = '';
        frames.forEach((f, i) => {
            const div = document.createElement('div');
            div.className = `frame ${i === currentIdx ? 'active' : ''}`;
            div.draggable = true;
            div.innerText = i + 1;
            
            div.onclick = () => { currentIdx = i; updateApp(); };
            
            // Reorder Events
            div.addEventListener('dragstart', () => { draggedIdx = i; div.classList.add('dragging'); });
            div.addEventListener('dragover', e => e.preventDefault());
            div.addEventListener('drop', () => {
                if(draggedIdx !== null && draggedIdx !== i) {
                    const temp = frames.splice(draggedIdx, 1)[0];
                    frames.splice(i, 0, temp);
                    currentIdx = i;
                    updateApp();
                }
            });
            div.addEventListener('dragend', () => div.classList.remove('dragging'));
            
            tl.appendChild(div);
        });
    }

    window.togglePlayback = () => {
        isPlaying = !isPlaying;
        document.getElementById('playBtn').innerText = isPlaying ? "STOP" : "PLAY ANIM";
        if(isPlaying) play();
    };

    function play() {
        if(!isPlaying) return;
        currentIdx = (currentIdx + 1) % frames.length;
        updateApp();
        setTimeout(play, 200);
    }

    ['rotX', 'rotY', 'rotZ'].forEach((id, axis) => {
        document.getElementById(id).oninput = (e) => {
            frames[currentIdx][selectedBone][axis] = parseFloat(e.target.value);
            updateApp();
        };
    });

    renderer.domElement.addEventListener('pointerdown', (e) => {
        const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const hit = raycaster.intersectObjects(clickables)[0];
        if (hit) { selectedBone = hit.object.userData.boneName; updateApp(); }
    });

    buildSkeleton();
    frames.push(Object.fromEntries(Object.keys(config).map(n => [n, [0,0,0]])));
    updateApp();
    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    animate();
</script>
</body>
</html>
